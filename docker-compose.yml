services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safewalk
      POSTGRES_PASSWORD: safewalk
      POSTGRES_DB: safewalk
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safewalk"]
      interval: 3s
      retries: 10
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://safewalk:safewalk@db:5432/safewalk
      SECRET_KEY: troque-esta-chave-em-producao-0123456789
    ports: ["8000:8000"]
