services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safewalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before using Docker Compose}
      POSTGRES_DB: ${POSTGRES_DB:-safewalk}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safewalk}"]
      interval: 3s
      retries: 10
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safewalk}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before using Docker Compose}@db:5432/${POSTGRES_DB:-safewalk}
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-}
    ports: ["127.0.0.1:8000:8000"]
